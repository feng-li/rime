# Dedicated English completion; does not modify the Chinese schema.
schema:
  schema_id: english_booster
  name: English Booster
  version: "2026-10-11.2"
  description: Natural English typing, verb forms, synonyms, spelling suggestions, and personal words.
  dependencies:
    - english_booster_inflections

switches:
  - name: ascii_mode
    reset: 0
    states: [Completion, Direct]
  - name: ascii_punct
    reset: 1
    states: [Chinese punctuation, ASCII punctuation]

engine:
  processors:
    - lua_processor@*input_mode_cycle
    - ascii_composer
    - recognizer
    - lua_processor@*english_booster*processor
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
    - lua_translator@*english_inflections
    - lua_translator@*english_synonyms
    - punct_translator
  filters:
    - lua_filter@*english_fuzzy
    - lua_filter@*english_booster*case_filter
    - uniquifier

command_mode:
  __include: english_commands:/command_mode

emacs_keys:
  __include: emacs_keys:/emacs_keys

menu:
  page_size: 5

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop

speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  initials: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: ""
  algebra:
    - derive/^.+$/\L$0/
    - derive/^./\U$0/
    - derive/^.+$/\U$0/

translator:
  dictionary: english_booster
  user_dict: english_booster
  enable_completion: true
  enable_user_dict: true
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  comment_format:
    - xform/^.+$//

# Exact-base lookup only: do not flood ordinary short-prefix completions.
# The Lua adapter supplies explicit spelling codes so the main English user
# dictionary learns safely without interpreting the secondary table's IDs.
inflections:
  dictionary: english_booster.inflections
  enable_completion: false
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  initial_quality: -0.75
  comment_format:
    - xform/^.+$//

# Offline exact-word thesaurus. Lower priority than learned completions and
# verb forms, but above ordinary static prefix completions. Set the limit to 0
# to disable. Plain candidates deliberately do not train replacement aliases.
synonyms:
  # Local candidate tables are Git-ignored. Relative paths use the Rime user directory.
  # Choose a table in english_booster.custom.yaml; empty/unreadable uses the fallback.
  data_file: ""
  fallback_file: en_dicts/wordnet_synonyms.lua
  max_candidates: 3
  initial_quality: -0.85

# Read-only spelling fallback; selected words learn through the main translator.
fuzzy:
  dictionary: english_booster
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false

punctuator:
  import_preset: default

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
    underscore: "^[A-Za-z]+_.*"

key_binder:
  bindings:
    - {when: has_menu, accept: Control+n, send: Down}
    - {when: has_menu, accept: Control+p, send: Up}
    - {when: has_menu, accept: Control+Shift+n, send: Page_Down}
    - {when: has_menu, accept: Control+Shift+p, send: Page_Up}
